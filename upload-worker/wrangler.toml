# Upload service for the site's "Send your frames" box. Deploy from this folder:  wrangler deploy
# Secrets (set once, never in this file, since the repo is public):  ADMIN_KEY, MAIL_TO  via  wrangler secret put <NAME>
# Invite codes live in the bucket (_config/codes.json), managed with PUT /admin/codes, so one can be withdrawn without a redeploy.
name = "gosforth-upload"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [ { pattern = "upload.oneoffx.uk", custom_domain = true } ]

# daily outbox clean-up (scheduled() in src/index.js), 06:00 UTC
[triggers]
crons = [ "0 6 * * *" ]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gosforth-uploads"

# the arrival note goes to MAIL_TO, which must be a verified Email Routing destination
[[send_email]]
name = "MAILER"

[vars]
MAIL_FROM = "uploads@oneoffx.uk"
